name: CI / Testes e Validacao Experimental

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build, Ingestao e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: helpdesk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Inicializar DDL e Extensao pgvector no PostgreSQL
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d helpdesk_db -f sql/init.sql

      - name: Cache do Modelo Sentence-Transformers (Hugging Face)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-mpnet-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-mpnet-

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          pip install -r requirements.txt
          pip install pytest

      - name: 1. Gerar Datasets e Padrao-Ouro (Ground Truth)
        run: |
          python scripts/generate_datasets.py

      - name: 2. Executar Ingestao, Chunking e Persistencia Vetorial
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: helpdesk_db
        run: |
          python scripts/ingest_and_embed.py

      - name: 3. Executar Testes Automatizados (Pytest)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: helpdesk_db
        run: |
          pytest -v

      - name: 4. Executar Bateria de Benchmark Experimental
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: helpdesk_db
        run: |
          python scripts/evaluate_benchmark.py

      - name: 5. Publicar Resultados do Experimento como Artefato no GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/
